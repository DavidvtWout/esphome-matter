# Variables: endpoint_id, light_id

esphome:
  on_boot:
    priority: -100
    then:
      - matter.set_attribute:
          endpoint: ${endpoint_id}
          cluster: on_off
          attribute: on_off
          value: !lambda return id(${light_id}).remote_values.is_on();
      - matter.set_attribute:
          endpoint: ${endpoint_id}
          cluster: level_control
          attribute: current_level
          value: !lambda |-
            return static_cast<uint64_t>(std::lroundf(
                id(${light_id}).remote_values.get_brightness() * 253.0f)) + 1;

matter:
  endpoints:
    ${endpoint_id}:
      dimmable_light:
      on_attribute:
        on_off.on_off:
          if:
            condition:
              lambda: return id(${light_id}).remote_values.is_on() != value;
            then:
              light.control:
                id: ${light_id}
                state: !lambda return value;
                transition_length: 0s
        level_control.current_level:
          if:
            condition:
              lambda: |-
                return value >= 1 && value <= 254 &&
                       std::fabs(id(${light_id}).remote_values.get_brightness() -
                                 value / 254.0f) >= 0.5f / 254.0f;
            then:
              light.control:
                id: ${light_id}
                brightness: !lambda return value / 254.0f;
                transition_length: 0s

light:
  - id: !extend ${light_id}
    on_state:
      then:
        - matter.set_attribute:
            endpoint: ${endpoint_id}
            cluster: on_off
            attribute: on_off
            value: !lambda return id(${light_id}).remote_values.is_on();
        - matter.set_attribute:
            endpoint: ${endpoint_id}
            cluster: level_control
            attribute: current_level
            value: !lambda |-
              return static_cast<uint64_t>(std::lroundf(
                  id(${light_id}).remote_values.get_brightness() * 253.0f)) + 1;
