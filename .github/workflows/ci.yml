name: CI

on:
  push:
    branches:
      - main
    paths:
      - "components/*"
      - "tests/**"
      - ".github/workflows/ci.yml"

  pull_request:
    paths:
      - "components/*"
      - "tests/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

env:
  DEFAULT_PYTHON: "3.12"  # Same as ESPHome

jobs:
  validate:
    name: Validate config (ESPHome ${{ matrix.esphome-version }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        esphome-version:
          - 2026.6.0
          - 2026.7.4

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python ${{ env.DEFAULT_PYTHON }}
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
      - name: Install ESPHome
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install "esphome==${{ matrix.esphome-version }}"

      - name: Check tests/configs/esp32-all-endpoints.yaml
        run: .venv/bin/esphome config tests/configs/esp32-all-endpoints.yaml
      - name: Check tests/configs/esp32-thread.yaml
        run: .venv/bin/esphome config tests/configs/esp32-thread.yaml
      - name: Check tests/configs/esp32-wifi.yaml
        run: .venv/bin/esphome config tests/configs/esp32-wifi.yaml

  compile:
    name: Compile ${{ matrix.config }} (ESPHome ${{ matrix.esphome-version }})
    runs-on: ubuntu-24.04
    needs: validate
    if: github.ref != 'refs/heads/main'
    strategy:
      matrix:
        config:
          - tests/configs/esp32-thread.yaml
          - tests/configs/esp32-wifi.yaml
        esphome-version:
          # - 2026.6.0
          - 2026.7.4

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python ${{ env.DEFAULT_PYTHON }}
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
      - name: Install ESPHome
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install "esphome==${{ matrix.esphome-version }}"

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ matrix.esphome-version }}-${{ matrix.config }}
          restore-keys: |
            ${{ runner.os }}-platformio-${{ matrix.esphome-version }}-
      - name: Cache ESPHome build
        uses: actions/cache@v6
        with:
          path: tests/configs/.esphome/build
          key: ${{ runner.os }}-build-${{ matrix.esphome-version }}-${{ matrix.config }}

      #  - name: Install ccache
      #    run: sudo apt-get update && sudo apt-get install -y ccache

      #  - name: Cache ccache
      #    uses: actions/cache@v6
      #    with:
      #      path: ${{ github.workspace }}/.ccache
      #      key: ${{ runner.os }}-ccache-${{ matrix.esphome-version }}-${{ matrix.config }}

      - name: Compile ESPHome config
        #  env:
        #    IDF_CCACHE_ENABLE: "1"
        #    CCACHE_DIR: ${{ github.workspace }}/.ccache
        #    CCACHE_BASEDIR: ${{ github.workspace }}
        #    CCACHE_COMPILERCHECK: content
        run: .venv/bin/esphome compile "${{ matrix.config }}"

      #  - name: Print ccache statistics
      #    env:
      #      CCACHE_DIR: ${{ github.workspace }}/.ccache
      #    run: ccache -s

  compile-all-wifi-variants:
    name: Compile matter-over-wifi ${{ matrix.esp32-variant }} (ESPHome ${{ matrix.esphome-version }})
    runs-on: ubuntu-24.04
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        esphome-version:
          - 2026.7.4
        esp32-variant:
          # - ESP32
          # - ESP32C2
          - ESP32C3
          # - ESP32C5
          # - ESP32C6
          # - ESP32S2
          - ESP32S3

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python ${{ env.DEFAULT_PYTHON }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
      - name: Install ESPHome
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install "esphome==${{ matrix.esphome-version }}"

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ matrix.esphome-version }}-${{ matrix.esp32-variant }}-wifi
          restore-keys: |
            ${{ runner.os }}-platformio-${{ matrix.esphome-version }}-
      - name: Cache ESPHome build
        uses: actions/cache@v6
        with:
          path: tests/configs/.esphome/build
          key: ${{ runner.os }}-build-${{ matrix.esphome-version }}-${{ matrix.esp32-variant }}-wifi
          restore-keys: |
            ${{ runner.os }}-build-${{ matrix.esphome-version }}-

      - name: Compile ESPHome config
        run: .venv/bin/esphome -s esp32_variant "${{ matrix.esp32-variant }}" compile tests/configs/esp32-wifi.yaml

  compile-all-thread-variants:
    name: Compile matter-over-thread ${{ matrix.esp32-variant }} (ESPHome ${{ matrix.esphome-version }})
    runs-on: ubuntu-24.04
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        esphome-version:
          - 2026.7.4
        esp32-variant:
          # - ESP32C5
          # - ESP32C6
          - ESP32H2

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python ${{ env.DEFAULT_PYTHON }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
      - name: Install ESPHome
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install "esphome==${{ matrix.esphome-version }}"

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ matrix.esphome-version }}-${{ matrix.esp32-variant }}-thread
          restore-keys: |
            ${{ runner.os }}-platformio-${{ matrix.esphome-version }}-
      - name: Cache ESPHome build
        uses: actions/cache@v6
        with:
          path: tests/configs/.esphome/build
          key: ${{ runner.os }}-build-${{ matrix.esphome-version }}-${{ matrix.esp32-variant }}-thread
          restore-keys: |
            ${{ runner.os }}-build-${{ matrix.esphome-version }}-

      - name: Compile ESPHome config
        run: .venv/bin/esphome -s esp32_variant "${{ matrix.esp32-variant }}" compile tests/configs/esp32-thread.yaml
