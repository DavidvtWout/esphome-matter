esphome:
  name: matter-ci-all-endpoints
  on_boot:
    priority: -100
    then:
      - matter.set_attribute:
          path: 4.on_off.on_off
          value: true
      - matter.send_event:
          path: generic_switch_endpoint.switch.initial_press
          fields:
            new_position: 1
      - matter.send_event:
          path: generic_switch_endpoint.switch.short_release
          fields:
            previous_position: 1

esp32:
  toolchain: platformio
  variant: ESP32C6
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../../components

logger:

api:

network:
  enable_ipv6: true

matter:
  endpoints:
    1:
      on_off_light_switch:
    2:
      dimmer_switch:
    3:
      on_off_light:
        light_id: binary_status_light
    4:
      dimmable_light:
        light_id: dimmable_status_light
        min_level: 10%
        max_level: 90%
    5:
      id: generic_switch_endpoint
      generic_switch:
    6:
      extended_color_light:
        light_id: rgb_status_light
    7:
      extended_color_light:
        light_id: rgbww_status_light
    100:
      temperature_sensor:
        temperature: internal_temp
    101:
      temperature_sensor: internal_temp
    102:
      air_quality_sensor:
        pm_2_5: test_pm25
        air_quality: test_air_quality

sensor:
  - platform: internal_temperature
    id: internal_temp
    name: Internal Temperature
  - platform: template
    id: test_pm25
    name: Test PM2.5
    lambda: return 5.0;
  - platform: template
    id: test_air_quality
    name: Test Air Quality
    lambda: return 1.0;

output:
  - platform: template
    type: binary
    id: binary_status_light_output
    write_action:
      - lambda: (void) state;
  - platform: template
    type: float
    id: dimmable_status_light_output
    write_action:
      - lambda: (void) state;
  - platform: template
    type: float
    id: red_status_light_output
    write_action:
      - lambda: (void) state;
  - platform: template
    type: float
    id: green_status_light_output
    write_action:
      - lambda: (void) state;
  - platform: template
    type: float
    id: blue_status_light_output
    write_action:
      - lambda: (void) state;
  - platform: template
    type: float
    id: cold_white_status_light_output
    write_action:
      - lambda: (void) state;
  - platform: template
    type: float
    id: warm_white_status_light_output
    write_action:
      - lambda: (void) state;

light:
  - platform: binary
    id: binary_status_light
    name: Binary Status Light
    output: binary_status_light_output
  - platform: monochromatic
    id: dimmable_status_light
    name: Dimmable Status Light
    output: dimmable_status_light_output
  - platform: rgb
    id: rgb_status_light
    name: RGB Status Light
    red: red_status_light_output
    green: green_status_light_output
    blue: blue_status_light_output
  - platform: rgbww
    id: rgbww_status_light
    name: RGBWW Status Light
    red: red_status_light_output
    green: green_status_light_output
    blue: blue_status_light_output
    cold_white: cold_white_status_light_output
    warm_white: warm_white_status_light_output
    cold_white_color_temperature: 6500 K
    warm_white_color_temperature: 2700 K
