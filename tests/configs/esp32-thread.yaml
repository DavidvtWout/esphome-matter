esphome:
  name: matter-ci-thread

substitutions:
  esp32_variant: ESP32C6

esp32:
  toolchain: platformio
  variant: ${esp32_variant}
  framework:
    type: esp-idf

external_components:
  - source: ../../components

logger:

api:

network:
  enable_ipv6: true

openthread:
  network_key: 0xdfd34f0f05cad978ec4e32b0413038ff
  network_name: matter-ci-thread
  pan_id: 0x1234
  channel: 15

matter:
  unicast_delay: 400ms
  min_command_interval: 250ms
  endpoints:
    - dimmer_switch:
      id: dimmer_endpoint
    - temperature_sensor:
        sensor_id: internal_temp

binary_sensor:
  - id: button_up
    platform: gpio
    pin:
      number: GPIO0
      mode:
        pullup: true
        input: true
      inverted: true
    on_click:
      matter.on_off.on: dimmer_endpoint
    on_press:
      matter.level_control.move_with_on_off:
        endpoint_id: dimmer_endpoint
        move_mode: 0
        rate: 50
    on_release:
      matter.level_control.stop_with_on_off: dimmer_endpoint
  - id: button_down
    platform: gpio
    pin:
      number: GPIO1
      mode:
        pullup: true
        input: true
      inverted: true
    on_click:
      matter.on_off.off: dimmer_endpoint
    on_press:
      matter.level_control.move_with_on_off:
        endpoint_id: dimmer_endpoint
        move_mode: 1
        rate: 50
    on_release:
      matter.level_control.stop_with_on_off: dimmer_endpoint
    on_double_click:
      matter._send_command:
        endpoint_id: dimmer_endpoint
        cluster_id: 0x0008
        command_id: 0x00
        data: '{"0:U8":128,"1:U16":0,"2:U8":0,"3:U8":0}'
        absolute: true

sensor:
  - platform: internal_temperature
    id: internal_temp
