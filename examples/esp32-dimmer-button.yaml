# This example involved a pre-configured openthread network. This way, the api is immediately available, even before
# matter is commissioned.
# After commissioning, the binding cluster (0x1e or 31) of the dimmer switch endpoint needs to be configured to point
# to the node id and cluster id of a matter light. The frontend of the python-matter-server has "Binding" button
# when you go to the binding cluster. This also adds the node id of the esphome device to the ACL of the light
# to make it accept the commands that the esphome device will send after binding.

esphome:
  name: matter-device
  friendly_name: Matter Device

esp32:
  toolchain: platformio
  variant: # Set to your variant
  framework:
    type: esp-idf

external_components:
  - source: github://DavidvtWout/esphome-matter@main

logger:

api:

network:
  enable_ipv6: true

openthread:
  tlv: !secret thread_tlv

matter:
  endpoints:
    1:
      id: dimmer_endpoint
      dimmer_switch:

# The two buttons are configured to be triggered when the GPIO pin is pulled down to GND.
binary_sensor:
  - name: "Button up"
    platform: gpio
    pin:
      number: GPIO0
      mode:
        pullup: true
        input: true
      inverted: true
    on_click:
      matter.on_off.on: dimmer_endpoint
    on_press:
      matter.level_control.move_with_on_off:
        endpoint_id: dimmer_endpoint
        move_mode: up
        rate: 20 %/s
    on_release:
      matter.level_control.stop_with_on_off: dimmer_endpoint
  - name: "Button down"
    id: button_down
    platform: gpio
    pin:
      number: GPIO1
      mode:
        pullup: true
        input: true
      inverted: true
    on_click:
      matter.on_off.off: dimmer_endpoint
    on_press:
      matter.level_control.move_with_on_off:
        endpoint_id: dimmer_endpoint
        move_mode: down
        rate: 20 %/s
    on_release:
      matter.level_control.stop_with_on_off: dimmer_endpoint
